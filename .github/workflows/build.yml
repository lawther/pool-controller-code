name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32c6
          path: '.'

      - name: Determine version
        id: ver
        run: |
          VERSION=$(git describe --always --dirty --tags 2>/dev/null || echo unknown)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install esptool
        run: pip install esptool

      - name: Stage release artifacts
        working-directory: build
        run: |
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p ../artifacts
          cp pool-controller.bin "../artifacts/pool-controller-${VER}.bin"
          esptool.py --chip esp32c6 merge_bin \
            -o "../artifacts/firmware-full-${VER}.bin" \
            @flash_args

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pool-controller-${{ steps.ver.outputs.version }}
          path: artifacts/*.bin
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pool-controller-${{ steps.ver.outputs.version }}.bin
            artifacts/firmware-full-${{ steps.ver.outputs.version }}.bin
          generate_release_notes: true
          fail_on_unmatched_files: true
